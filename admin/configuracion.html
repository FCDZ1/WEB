<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración | Administración</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="../img/logo.svg" type="image/svg+xml">
</head>
<body>

<div class="panel-app">

    <aside class="barra-lateral" id="barra-lateral">
        <div class="marca-panel">
            <img src="../img/logo.svg" alt="Logo">
            <span>Panel Admin</span>
        </div>
        <nav>
            <a href="panel.html">🏠 Dashboard</a>
            <a href="noticias.html">📰 Noticias</a>
            <a href="biblioteca.html">📚 Biblioteca</a>
            <a href="configuracion.html" class="activo">⚙️ Configuración</a>
            <a href="../index.html" target="_blank">🌐 Ver sitio público</a>
        </nav>
    </aside>

    <div class="contenido-principal">
        <header class="barra-superior">
            <div style="display:flex; align-items:center; gap:14px;">
                <button class="boton-menu-panel" id="boton-menu-panel">☰</button>
                <h2>Configuración</h2>
            </div>
            <div class="usuario-sesion">
                <span>👤 <strong id="nombre-admin-sesion">Administrador</strong></span>
                <button class="boton boton-secundario" id="boton-cerrar-sesion">Cerrar sesión</button>
            </div>
        </header>

        <main class="contenido-panel">

            <!-- ===== Información institucional ===== -->
            <div class="tarjeta-panel">
                <h3>Información institucional</h3>
                <div id="mensaje-estado-config" class="mensaje-estado"></div>

                <form id="formulario-configuracion">
                    <div class="fila-formulario">
                        <div class="grupo-formulario">
                            <label for="config-nombre">Nombre de la institución *</label>
                            <input type="text" id="config-nombre" required maxlength="150">
                        </div>
                        <div class="grupo-formulario">
                            <label for="config-eslogan">Eslogan</label>
                            <input type="text" id="config-eslogan" maxlength="150">
                        </div>
                    </div>

                    <div class="grupo-formulario">
                        <label for="config-info">Información institucional (texto "Sobre nosotros")</label>
                        <textarea id="config-info" maxlength="1500" style="min-height:110px;"></textarea>
                    </div>

                    <div class="fila-formulario">
                        <div class="grupo-formulario">
                            <label for="config-direccion">Dirección</label>
                            <input type="text" id="config-direccion" maxlength="200">
                        </div>
                        <div class="grupo-formulario">
                            <label for="config-telefono">Teléfono</label>
                            <input type="text" id="config-telefono" maxlength="40">
                        </div>
                    </div>

                    <div class="fila-formulario">
                        <div class="grupo-formulario">
                            <label for="config-email">Correo de contacto</label>
                            <input type="email" id="config-email" maxlength="150">
                        </div>
                        <div class="grupo-formulario">
                            <label for="config-notas-url">Enlace de la plataforma de notas *</label>
                            <input type="url" id="config-notas-url" required maxlength="300" placeholder="https://...">
                        </div>
                    </div>

                    <div class="fila-formulario">
                        <div class="grupo-formulario">
                            <label for="config-facebook">Facebook (URL, opcional)</label>
                            <input type="url" id="config-facebook" maxlength="300">
                        </div>
                        <div class="grupo-formulario">
                            <label for="config-instagram">Instagram (URL, opcional)</label>
                            <input type="url" id="config-instagram" maxlength="300">
                        </div>
                    </div>

                    <div class="fila-formulario">
                        <div class="grupo-formulario">
                            <label>Logo institucional</label>
                            <div class="zona-subida" onclick="document.getElementById('input-logo').click()">
                                <img id="vista-logo-actual" src="../img/logo.svg" style="width:60px; margin:0 auto 8px;">
                                <div>Haz clic para cambiar el logo</div>
                                <input type="file" id="input-logo" accept=".jpg,.jpeg,.png,.webp,.gif" style="display:none;">
                            </div>
                        </div>
                        <div class="grupo-formulario">
                            <label>Imagen de banner (portada de inicio)</label>
                            <div class="zona-subida" onclick="document.getElementById('input-banner').click()">
                                <img id="vista-banner-actual" src="" style="width:100%; max-height:80px; object-fit:cover; margin-bottom:8px; display:none; border-radius:6px;">
                                <div>Haz clic para subir/cambiar el banner</div>
                                <input type="file" id="input-banner" accept=".jpg,.jpeg,.png,.webp,.gif" style="display:none;">
                            </div>
                        </div>
                    </div>

                    <h3 style="margin-top:10px;">Avisos importantes</h3>
                    <div id="contenedor-avisos-form"></div>
                    <button type="button" class="boton boton-secundario" id="boton-agregar-aviso" style="margin-bottom:20px;">+ Agregar aviso</button>

                    <div>
                        <button type="submit" class="boton boton-primario" id="boton-guardar-config">Guardar configuración</button>
                    </div>
                </form>
            </div>

            <!-- ===== Cambiar contraseña ===== -->
            <div class="tarjeta-panel">
                <h3>Cambiar contraseña de acceso</h3>
                <div id="mensaje-estado-password" class="mensaje-estado"></div>

                <form id="formulario-password">
                    <div class="fila-formulario">
                        <div class="grupo-formulario">
                            <label for="password_actual">Contraseña actual *</label>
                            <input type="password" id="password_actual" name="password_actual" required autocomplete="current-password">
                        </div>
                        <div class="grupo-formulario">
                            <label for="password_nueva">Nueva contraseña (mín. 8 caracteres) *</label>
                            <input type="password" id="password_nueva" name="password_nueva" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>
                    <div class="grupo-formulario">
                        <label for="password_confirmacion">Confirmar nueva contraseña *</label>
                        <input type="password" id="password_confirmacion" name="password_confirmacion" required minlength="8" autocomplete="new-password">
                    </div>
                    <button type="submit" class="boton boton-primario" id="boton-cambiar-password">Cambiar contraseña</button>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/configuracion.js"></script>
</body>
</html>
