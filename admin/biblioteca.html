<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca | Administración</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" href="../img/logo.svg" type="image/svg+xml">
</head>
<body>

<div class="panel-app">

    <aside class="barra-lateral" id="barra-lateral">
        <div class="marca-panel">
            <img src="../img/logo.svg" alt="Logo">
            <span>Panel Admin</span>
        </div>
        <nav>
            <a href="panel.html">🏠 Dashboard</a>
            <a href="noticias.html">📰 Noticias</a>
            <a href="biblioteca.html" class="activo">📚 Biblioteca</a>
            <a href="configuracion.html">⚙️ Configuración</a>
            <a href="../index.html" target="_blank">🌐 Ver sitio público</a>
        </nav>
    </aside>

    <div class="contenido-principal">
        <header class="barra-superior">
            <div style="display:flex; align-items:center; gap:14px;">
                <button class="boton-menu-panel" id="boton-menu-panel">☰</button>
                <h2>Gestión de Biblioteca</h2>
            </div>
            <div class="usuario-sesion">
                <span>👤 <strong id="nombre-admin-sesion">Administrador</strong></span>
                <button class="boton boton-secundario" id="boton-cerrar-sesion">Cerrar sesión</button>
            </div>
        </header>

        <main class="contenido-panel">

            <div class="tarjeta-panel">
                <h3 id="titulo-formulario-doc">Agregar documento</h3>
                <div id="mensaje-estado-doc" class="mensaje-estado"></div>

                <form id="formulario-documento">
                    <div class="fila-formulario">
                        <div class="grupo-formulario">
                            <label for="doc-titulo">Título *</label>
                            <input type="text" id="doc-titulo" required maxlength="150">
                        </div>
                        <div class="grupo-formulario">
                            <label for="doc-categoria">Categoría *</label>
                            <input type="text" id="doc-categoria" required maxlength="60" placeholder="Ej. Reglamentos, Guías, Circulares">
                        </div>
                    </div>

                    <div class="grupo-formulario">
                        <label for="doc-descripcion">Descripción</label>
                        <textarea id="doc-descripcion" maxlength="500" style="min-height:80px;"></textarea>
                    </div>

                    <div class="grupo-formulario">
                        <label for="doc-fecha">Fecha de publicación *</label>
                        <input type="date" id="doc-fecha" required>
                    </div>

                    <div class="grupo-formulario">
                        <label>Archivo PDF *</label>
                        <div class="zona-subida" id="zona-subida-pdf">
                            <div>📄 Haz clic para seleccionar un archivo PDF (máx. 20 MB)</div>
                            <div class="nombre-archivo" id="nombre-archivo-pdf">Ningún archivo seleccionado</div>
                            <input type="file" id="input-pdf-documento" accept=".pdf">
                        </div>
                    </div>

                    <div style="display:flex; gap:12px; margin-top:10px;">
                        <button type="submit" class="boton boton-primario" id="boton-guardar-doc">Guardar documento</button>
                        <button type="button" class="boton boton-secundario oculto" id="boton-cancelar-edicion-doc">Cancelar edición</button>
                    </div>
                </form>
            </div>

            <div class="tarjeta-panel">
                <h3>Documentos publicados</h3>
                <div id="tabla-documentos">
                    <p class="cargando-texto">Cargando documentos...</p>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/biblioteca.js"></script>
</body>
</html>
